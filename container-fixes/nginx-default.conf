# Default server configuration
#
    # server {
    #     include /disent/system/nginx_conf/listen.conf;
    #     server_name ~^(?<pname>.*)\-(?<sub>.*)\.XXXCOMTLDXXX\.com$;
    #     set $subdomain $pname-$sub;
    #     location / { 
    #         set $port $port_out;
    #         include /disent/system/nginx_conf/proxy.conf; 
    #         proxy_intercept_errors on;
    #         proxy_next_upstream off;
    #         error_page 502 503 504 =302 https://$sub.XXXCOMTLDXXX.com/_$pname;
    #     }
    # }
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	#
	# Note: You should disable gzip for SSL traffic.
	# See: https://bugs.debian.org/773332
	#
	# Read up on ssl_ciphers to ensure a secure configuration.
	# See: https://bugs.debian.org/765782
	#
	# Self signed certs generated by the ssl-cert package
	# Don't use them in a production server!
	#
	# include snippets/snakeoil.conf;

	# The default_server catches every request whose Host matches no other
	# block — including the platform's own https://my-container-80.example.com
	# So :80 IS the homepage. Serve it from disk.
	#
	# It previously did `proxy_pass http://127.0.0.1:5173` (a Vite dev server
	# that is not running), which made EVERY unmatched host return 502 —
	# including the homepage itself. Removed 2026-08-10.
	root /srv/apps/homepage;

	index index.html index.htm index.nginx-debian.html;

	server_name _;

	location / {
		# Serve the requested file, then the directory, then fall back to
		# index.html so the homepage renders for any path.
		try_files $uri $uri/ /index.html;
	}

	# Never cache the homepage shell — manifest.json changes must show up
	# immediately, otherwise a stale tile list survives every deploy.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location = /manifest.json {
		add_header Cache-Control "no-cache";
	}

	# pass PHP scripts to FastCGI server
	#
	#location ~ \.php$ {
	#	include snippets/fastcgi-php.conf;
	#
	#	# With php-fpm (or other unix sockets):
	#	fastcgi_pass unix:/run/php/php7.4-fpm.sock;
	#	# With php-cgi (or other tcp sockets):
	#	fastcgi_pass 127.0.0.1:9000;
	#}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}
}


