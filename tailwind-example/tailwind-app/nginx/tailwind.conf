# NGINX reverse proxy for the `tailwind` example (frontend, Vite dev server).
#
# Routing is BY PORT (CLAUDE.md §2): my-container-3003.example.com maps to
# container:3003. A per-app server_name is unnecessary, and deploy.sh
# regenerates this conf on every run — so `server_name _` (catch-all) is fine.
# :3003 is PROPOSED — confirm with Anthony. Do NOT use the retired
# `*.fastcontainers.net` scheme (§4) — it is a bug.
#
# For production a frontend-only app is usually `vite build` + serve dist/
# statically; this proxies the dev server so the tile shows a live, editable app.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — REQUIRED: Vite's Hot Module Replacement runs over
        # a WebSocket; without these headers the page keeps trying to reconnect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
