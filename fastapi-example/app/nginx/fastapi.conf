# NGINX reverse proxy for the `fastapi` example.
#
# IMPORTANT (CLAUDE.md §2/§3): the platform routes to the app BY PORT
#   my-container-8000.example.com  ->  container:8000
# so a per-app `server_name` block is NOT required — the subdomain->port
# mapping is handled by the platform, and `deploy.sh` REGENERATES the nginx
# conf on every run (manual edits here get dropped). This file is kept for
# documentation/parity with the other examples; the real proxy is emitted by
# deploy.sh's generator. Do NOT reintroduce the retired
# `{project}-{app}.fastcontainers.net` scheme (CLAUDE.md §4) — it is a bug.

server {
    listen 80;
    listen [::]:80;
    server_name _;  # port-routed; catch-all rather than a fixed subdomain

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support — harmless here, kept for parity with the
        # fullstack/AI rows that need it.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
