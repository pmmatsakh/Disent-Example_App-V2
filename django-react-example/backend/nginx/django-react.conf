# NGINX reverse proxy for the `django_react` fullstack example.
#
# Routing is BY PORT (CLAUDE.md §2): my-container-8004.example.com maps to
# container:8004. Django serves BOTH the API (/api/*) and the built React app on
# this single port, so nginx just proxies everything to :8004. A per-app
# server_name is unnecessary, and deploy.sh regenerates this conf on every run —
# so `server_name _` (catch-all) is fine. :8004 is PROPOSED — confirm with
# Anthony. Do NOT use the retired `*.fastcontainers.net` scheme (§4) — it is a bug.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:8004;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
