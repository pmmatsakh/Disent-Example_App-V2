# NGINX reverse proxy for the `langchain` example.
# Routing is BY PORT (CLAUDE.md §2): my-container-3401.example.com maps to
# container:3401. server_name _ (catch-all) — deploy.sh regenerates this conf.
# :3401 is PROPOSED (AI 3400s block) — confirm with Anthony.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location / {
        proxy_pass         http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
