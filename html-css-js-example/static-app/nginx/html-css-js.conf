# NGINX config for the `html_css_js` example (frontend, static).
# Drop into the container's sites-enabled and reload:
#   sudo cp html-css-js.conf /etc/nginx/sites-enabled/html-css-js.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing is BY PORT (CLAUDE.md §2): my-container-{port}.example.com maps
# to container:{port}. A per-app server_name is unnecessary, and deploy.sh
# regenerates this conf on every run — so server_name _ (catch-all) is fine.
# (html_css_js's port is not yet assigned — deferred. Replace the root path.)
#
# NOTE: this example is unique among the rows — there is NO application to
# proxy to. There's no Node process, no Python process, nothing to keep alive.
# NGINX reads the three files off disk and sends them to the browser. So this
# config uses `root`, not `proxy_pass`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Point this at the folder containing index.html, styles.css, app.js.
    root /path/to/static-app;
    index index.html;

    location / {
        # Serve the requested file; fall back to index.html if not found.
        try_files $uri $uri/ /index.html;
    }

    # Cache the static assets, but never the HTML — otherwise browsers hold on
    # to a stale page after an update. (Frameworks handle this by putting a
    # hash in the filename; with hand-written files we do it here instead.)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
