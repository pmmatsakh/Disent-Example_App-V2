# NGINX reverse proxy for the `vite react` example (frontend).
# Drop into the container's sites-enabled and reload:
#   sudo cp vite-react.conf /etc/nginx/sites-enabled/vite-react.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing is BY PORT (CLAUDE.md §2): my-container-{port}.example.com maps
# to container:{port}. A per-app server_name is unnecessary, and deploy.sh
# regenerates this conf on every run — so server_name _ (catch-all) is fine.
#
# NOTE: this app is FRONTEND-ONLY. `npm run build` emits static files into
# dist/ — there is no application server required in production. Two options
# below; pick one and comment out the other.

# ---------------------------------------------------------------------------
# OPTION A — proxy to the Vite dev server on 5174 (matches the spec's port,
# gives hot reload, but requires the dev server to stay running).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:5174;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — REQUIRED. Vite's Hot Module Replacement runs over
        # a WebSocket; without these headers the page keeps trying to reconnect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------------------
# OPTION B — serve the built static files directly (no Node process running).
# This is the normal production shape for a frontend-only app: run
# `npm run build` once, and NGINX serves dist/ straight off disk.
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name _;
#
#     root /path/to/vite-app/dist;
#     index index.html;
#
#     location / {
#         # SPA fallback: unknown paths return index.html so client-side
#         # routing works on refresh.
