# NGINX reverse proxy for the `nextjs` example (frontend/backend).
# Drop into the container's sites-enabled and reload:
#   sudo cp nextjs.conf /etc/nginx/sites-enabled/nextjs.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing is BY PORT (CLAUDE.md §2): my-container-{port}.example.com maps
# to container:{port}. A per-app server_name is unnecessary, and deploy.sh
# regenerates this conf on every run — so server_name _ (catch-all) is fine.
# TLS on 443 is expected to be handled by the container's existing cert setup.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — REQUIRED for Next.js. Fast Refresh (hot reload) in
        # dev runs over a WebSocket; without these headers the dev server keeps
        # trying to reconnect. Harmless in production.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
