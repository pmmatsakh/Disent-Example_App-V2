# NGINX reverse proxy for the `c_cpp` example.
#
# Routing is BY PORT (CLAUDE.md §2): my-container-3007.example.com maps to
# container:3007. A per-app server_name is unnecessary, and deploy.sh
# regenerates this conf on every run — so server_name _ (catch-all) is fine.
# :3007 is PROPOSED — confirm with Anthony. Do NOT use the retired
# `*.fastcontainers.net` scheme (§4) — it is a bug.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:3007;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
