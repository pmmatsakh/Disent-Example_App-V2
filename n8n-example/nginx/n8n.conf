# NGINX reverse proxy for the `n8n` example.
# Routing is BY PORT (CLAUDE.md §2): my-container-5678.example.com -> :5678.
# 5678 is n8n's NATIVE port (per the tracker/§6) — not proposed.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location / {
        proxy_pass         http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade — REQUIRED: the n8n editor uses push connections.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
