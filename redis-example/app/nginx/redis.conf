# NGINX reverse proxy for the `redis` example.
# Routing is BY PORT (CLAUDE.md §2): my-container-8006.example.com -> :8006.
# The DATABASE itself is NOT proxied — it stays on 127.0.0.1.
# :8006 is PROPOSED — confirm with Anthony.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location / {
        proxy_pass         http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
